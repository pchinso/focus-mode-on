[project]
name = "focus-mode-on"
version = "1.0.0"
description = "Personal task management over a Markdown vault, with an optional AI command layer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-frontmatter>=1.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "passlib>=1.7.4",
    "python-dotenv>=1.0",
    "truststore>=0.9",
]

[project.optional-dependencies]
ai = ["openai>=1.30", "pillow>=10.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
